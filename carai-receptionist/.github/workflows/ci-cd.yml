name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: carai_receptionist_test
          POSTGRES_USER: carai_user
          POSTGRES_PASSWORD: test_password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U carai_user -d carai_receptionist_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://carai_user:test_password@localhost:5432/carai_receptionist_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key
      DEBUG: true
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Run tests
        run: |
          pytest core/identity/organizations/tests/
          pytest core/identity/business/tests/
          # Add more test paths as needed
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Build Docker image
        run: |
          docker build -t carai-receptionist:test .
      - name: Save Docker image
        run: |
          docker save carai-receptionist:test | gzip > carai-receptionist.tar.gz
      - name: Upload Docker image
        uses: actions/upload-artifact@v3
        with:
          name: docker-image
          path: carai-receptionist.tar.gz

