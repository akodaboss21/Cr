version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: carai-postgres
    environment:
      POSTGRES_DB: carai_receptionist
      POSTGRES_USER: carai_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carai_user -d carai_receptionist"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carai-network

  # Redis for caching and job queue
  redis:
    image: redis:7-alpine
    container_name: carai-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carai-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carai-backend
    environment:
      DATABASE_URL: postgresql://carai_user:${POSTGRES_PASSWORD:-secure_password}@postgres:5432/carai_receptionist
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DEBUG: ${DEBUG:-false}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./carai-receptionist:/app
    networks:
      - carai-network
    restart: unless-stopped

  # Background Worker (PyRunner)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: carai-worker
    environment:
      DATABASE_URL: postgresql://carai_user:${POSTGRES_PASSWORD:-secure_password}@postgres:5432/carai_receptionist
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DEBUG: ${DEBUG:-false}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./carai-receptionist:/app
    networks:
      - carai-network
    restart: unless-stopped

  # Nginx Reverse Proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: carai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - carai-network
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:

networks:
  carai-network:
    driver: bridge